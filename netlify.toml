[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/signup.html"
  to = "/log-hours.html"
  status = 301

[[redirects]]
  from = "/memory-wall.html"
  to = "/centenary.html"
  status = 301

[[redirects]]
  from = "/initiatives.html"
  to = "/committees.html"
  status = 301

[[redirects]]
  from = "/alumni.html"
  to = "/schools.html"
  status = 301

[[redirects]]
  from = "/get-involved.html"
  to = "/contact.html"
  status = 301
